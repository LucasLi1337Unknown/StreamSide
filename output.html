<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamSide — Clean output</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080e10;color:#fff;font-family:system-ui}body.camera{height:100vh;display:grid;place-items:center;overflow:hidden}canvas{display:block;max-width:100%;max-height:100vh;object-fit:contain;width:100%;height:100%}.notice{position:fixed;bottom:12px;left:20px;font-size:12px;color:#a7b7ad;background:#0d181c;padding:8px 13px;border-radius:5px}body.timer{background:transparent;display:grid;place-items:center;height:100vh}.timer-box{text-align:center;background:#10191fe6;padding:30px 60px;border-radius:16px;max-width:100%}.timer-box small{color:#b4f272;letter-spacing:4px;text-transform:uppercase;font-size:15px}.timer-box h1{font-size:clamp(60px,16vw,180px);font-variant-numeric:tabular-nums;margin:0;letter-spacing:-5px}.prompter #controls{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:15px;background:#10191f;padding:15px;z-index:2}.prompter button{color:#111;background:#b4f272;border:0;padding:10px 18px;border-radius:5px;cursor:pointer}.prompter #script{font-size:clamp(24px,4vw,44px);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;max-width:1000px;margin:50vh auto;padding:0 8% 60vh}.prompter .reading-line{position:fixed;top:45%;left:0;right:0;border-top:1px solid #b4f27244;pointer-events:none}</style><script defer src="output.js"></script></head><body><canvas id="output" width="1280" height="720"></canvas><p class="notice" id="notice">Connecting to your Studio window…</p></body></html>
